name: CI

# `npm run build` ist hier zweistufig: erst `astro build`, dann
# `scripts/verify-seo.mjs` gegen das erzeugte dist/. Der Waechter bricht den
# Build bei fehlendem Titel oder fehlender Description, doppelten Titeln,
# fehlendem oder mehrfachem Canonical, Bildern ohne width/height,
# abgelaufenem priceValidUntil, Schriften vom Google-CDN, Platzhaltertext in
# JSON-LD, ins Leere zeigenden Preloads und Widerspruechen zwischen noindex
# und Sitemap.
#
# Sichtbare Platzhalter zaehlt er, ohne den Build zu brechen - sie sind ein
# Go-Live-Kriterium, kein Merge-Kriterium.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build und SEO-Waechter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Build und Pruefung
        run: npm run build
